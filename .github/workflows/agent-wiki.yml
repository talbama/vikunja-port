name: agent-wiki

# Trigger: a pull request merged into the default branch. The agent proposes wiki edits under .agents/wiki/ as a
# docs PR; a human merges it. PRs opened by the wiki agent itself (agent/wiki-*) never retrigger it.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: merged PR number
        required: true
      dry_run:
        description: print GitHub writes instead of performing them
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-wiki-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  wiki:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       !startsWith(github.event.pull_request.head.ref, 'agent/wiki-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Check out the application (default branch, after the merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: app

      - name: Check out the agent (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: talbama/agent-pipeline-port
          ssh-key: ${{ secrets.AGENT_DEPLOY_KEY }}
          path: agent

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install
        run: |
          cd agent && uv sync --frozen
          cd ../app && git config user.name "agent-pipeline" && git config user.email "agent-pipeline@users.noreply.github.com"

      - name: Refresh the wiki
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AGENT_REPO_ROOT: ${{ github.workspace }}/app
          AGENT_EVENTS_PATH: ${{ github.workspace }}/agent/metrics/events.jsonl
        run: |
          uv run python -m agent wiki --pr "$PR" ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Append this run's events to the metrics branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_KIND: wiki
        run: |
          set -e
          EV="$GITHUB_WORKSPACE/agent/metrics/events.jsonl"
          [ -s "$EV" ] || { echo "no events to append"; exit 0; }
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch metrics "$URL" mb 2>/dev/null; then cd mb; else
            git init -q mb && cd mb && git remote add origin "$URL" && git checkout -q --orphan metrics
            printf '# Agent metrics\n\nEvent logs (`events/*.jsonl`), collector cursor, and the generated `REPORT.md`. Written by GitHub Actions only.\n' > README.md
          fi
          git config user.name agent-pipeline && git config user.email agent-pipeline@users.noreply.github.com
          mkdir -p events && cp "$EV" "events/${RUN_KIND}-${GITHUB_RUN_ID}.jsonl"
          git add -A && git commit -qm "events: ${RUN_KIND} run ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do git push -q origin metrics && break; git pull -q --rebase origin metrics || true; sleep $((i*3)); done

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-wiki-pr-${{ env.PR }}
          path: |
            agent/metrics/events.jsonl
            agent/runs/
          if-no-files-found: ignore
